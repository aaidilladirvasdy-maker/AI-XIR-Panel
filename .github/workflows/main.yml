
name: Build AI XIR APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP" -d project
          GRADLE_FILE=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle project not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-XIR-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
